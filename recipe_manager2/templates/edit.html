{% extends "base.html" %}
{% block content %}
<form method="post">
	<div class="mb-3">
		<label class="form-label">Title</label>
		<input type="text" name="title" value="{{ recipe.title if recipe else '' }}" class="form-control" required>
	</div>
	<div class="mb-3">
		<label class="form-label">Ingredients(comma-separated)</label>
		<textarea name="ingredients" class="form-control" rows="2" required>{{ recipe.ingredients | join(',') if recipe else '' }}</textarea>
	</div>
	<div>
		<label class="form-label">Steps(one per line)</label>
		<textarea name="steps" class="form-control" rows="4" required>{{ recipe.steps | join('\n') if recipe else '' }}</textarea>
	</div>
	<button type="submit" class="btn btn-primary">{{ 'Update' if recipe else 'Add' }} Recipe</button>
</form>
{% endblock %}
