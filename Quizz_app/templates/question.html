<!DOCTYPE html>
<html>
<head>
	<title>Question {{ q_num }}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		input[type="radio"]{
		accent-color: #0d6efd;
		}
	</style>
</head>
<body class="container mt-5">
{% if feedback %}
		<div class="alert alert-info mt-3">{{ feedback }}</div>
	{% endif %}
	<h4>Question {{ q_num }} of {{ total }}</h4>
	<div class="progress mb-3" style="height: 20px;">
		<div class="progress-bad bg-success" role="progressbar" style="width: {{ progress }}%;" aria-valuenow="{{ progress }}" aria-valuemin="0" aria-valuemax="100">
			{{ progress }}%
		</div>
	</div>
	<form method="POST">
		<p class="mt-3"><strong>{{ question.question_text }}</strong></p>
			{% for opt in question.options %}
				<div class="form-check">
					<input class="form-check-input border border-dark me-2" type="radio" name="answer" id="{{ opt }}" value="{{ opt }}" required>
					<label class="form-check-label" for="opt{{ loop.index }}">{{ opt }}</label>
				</div>
			{% endfor %}
			<button type="submit" class="btn btn-success mt-3">Submit</button>
	</form>
	
	<div class="mt-4">
		<a href="{{ url_for('index') }}" class="btn btn-seconday">Home</a>
	</div>
</body>
</html>
