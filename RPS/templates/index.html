<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Rock Paper Scissors</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light text-center p-5">
	<div class="container">
		<h1 class="mb-4">Rock Paper Scissors</h1>
		<form method="POST">
			<button type="submit" name="choice" value="rock" class="btn btn-danger m-2">Rock</button>
			<button type="submit" name="choice" value="paper" class="btn btn-primary m-2">Paper</button>
			<button type="submit" name="choice" value="scissors" class="btn btn-success m-2">Scissors</button>
		</form>
		
		{% if result %}
			<div class="alert alert-info m-4">
				<p><strong>You Chose: </strong>{{ user_choice }}</p>
				<p><strong>Computer chose: </strong>{{ computer_choice }}</p>
				<h4>{{ result }}</h4>
			</div>
		{% endif %}
	</div>
</body>
</html>
