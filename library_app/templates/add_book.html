{% extends "base.html" %}
{% block content %}

<div class="card shadow-lg p-4 mx-auto border-0" style="max-width: 500px; border-radius: 15px;">
	<h3 class="mb-4 text-center text-primary">+ Add New Book</h3>
	
	<form method="POST">
		<div class="mb-3">
			<label class="form-label fw-semibold">Title</label>
			<input type="text" name="title" class="form-control form-control-lg shadow-sm" placeholder="Enter book title" required>
        </div>
		
		<div class="mb-3">
			<label class="form-label fw-semibold">Author</label>
			<input type="text" name="author" class="form-control form-control-lg shadow-sm" placeholder="Enter author name" required>
        </div>
		
		<div class="mb-3">
			<label class="form-label fw-semibold">Year</label>
			<input type="number" name="year" class="form-control form-control-lg shadow-sm" placeholder="Enter year" required>
        </div>
		
		<button class="btn btn-primary w-100 btn-lg mt-2 shadow">
			<i class="bi bi-check=circle"></i>Add Book 
		</button>
		
	</form>
	
	<a href="/"  class="btn btn-link mt-3 text-center">Back to home</a>
</div>
{% endblock %}
