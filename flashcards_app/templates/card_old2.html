<!DOCTYPE html>
<html>
<head>
	<title>Flashcard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
	.flip-card{
	background-color: transparent;
	width: 300px;
	height: 200px;
	perspective: 1000px;
	margin: auto;
	}
	.flip-card-inner{
	position: relative;
	width: 100%;
	height: 100%;
	transition: transform 0.6s;
	transform-style: preserve-3d;
	}
	.flipped .flip-card-inner{
	transform: rotateY(180deg);
	}
	.flip-card-front,
	.flip-card-back{
	position: absolute;
	width: 100%;
	height: 100%;
	backface-visibility: hidden;
	display: flex;
	align-items: center;
	justify-content: center;
	border: 1px solid #ccc;
	border-radius: 10px;
	background-color: #f8f9fa;
	box-shadow: 0 4px 8px rgba(0,0,0,0.2);
	}
	
	.flip-card-back{
	transform: rotateY(180deg);
	}
	</style>
</head>
<body class="text-center mt-5">
	<h2>Click on the card to flip</h2>
	
		<div class="flip-card mt-3" onclick="flipCard()">
			<div class="flip-card-inner" id="cardInner">
				<div class="flip-card-front">
					<h4>{{ card.question }}</h4>
				</div>
				<div class="flip-card-back">
					<h4>{{ card.answer }}</h4>
				</div>
			</div>
		</div>
		
		<form method="POST" action="{{ url_for('answer') }}" class="mt-4">
			<button name="result" value="correct" class="btn btn-success m-2" >COrrect</button>
			<button name="result" value="incorrect" class="btn btn-danger m-2">Incorrect</button>
		</form>
		
		<script>
			function flipCard(){
			const card  = document.querySelector('.flip-card');
			card.classList.toggle('flipped');
			}
		</script>
</body>
</html>
