<!DOCTYPE html>
<html>
<head>
	<title>Flashcard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center mt-5">
	<div class="container">
		<div class="card" style="width: 18rem; margin:auto;">
			<div class="card-body">
				<h5 class="card-title">Q: {{ card.question }}</h5>
				<p class="card-text">A: {{ card.answer }}</p>
			</div>
		</div>
		<form method="post" action="{{ url_for('answer') }}">
			<button name="result" value="correct" class="btn btn-success m-2">Correct</button>
			<button name="result" value="incorrect" class="btn btn-danfer m-2">Incorrect</button>
		</form>
	</div>
</body>
</html>
