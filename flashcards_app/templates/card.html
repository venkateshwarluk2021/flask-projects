<!DOCTYPE html>
<html>
<head>
  <title>Flashcard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    .flip-card {
      background-color: transparent;
      width: 100%;
      max-width: 320px;
      height: 200px;
      perspective: 1000px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #fff;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      padding: 15px;
      text-align: center;
    }

    .flip-card-back {
      transform: rotateY(180deg);
    }

    .button-group {
      display: flex;
      justify-content: center;
      margin-top: 25px;
      gap: 20px;
    }

    .btn {
      min-width: 100px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>Click the card to flip</h2>

  <div class="flip-card" onclick="flipCard()">
    <div class="flip-card-inner" id="cardInner">
      <div class="flip-card-front">
        <h4>{{ card.question }}</h4>
      </div>
      <div class="flip-card-back">
        <h4>{{ card.answer }}</h4>
      </div>
    </div>
  </div>

  <form method="POST" action="{{ url_for('answer') }}" class="button-group">
    <button name="result" value="correct" class="btn btn-success">Correct</button>
    <button name="result" value="incorrect" class="btn btn-danger">Incorrect</button>
  </form>

  <script>
    function flipCard() {
      const card = document.querySelector('.flip-card');
      card.classList.toggle('flipped');
    }
  </script>
</body>
</html>
