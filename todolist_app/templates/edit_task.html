<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Add Task</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.form-check-input{
		transform: scale(1.5);
		border: 2px solid #555;
		cursor: pointer;
		}
		.form-check-label{
		margin-left: 0.5rem;
		font-weight: 500;
		}
	</style>
</head>
<body class="bg-light">
	<div class="container mt-4">
		<h2>Edit Task</h2>
			<form method="POST">
				<div class="mb-3">
					<label>Title:</label>
					<input type="text" name="title" class="form-control" value="{{task.title}}" required>
				</div>
				<div class="mb-3">
					<label>Description:</label>
					<textarea name="description" class="form-control" rows="3">{{ task.description }}</textarea>
				</div>
				<div class="mb-3">
					<label>Deadline:</label>
					<input type="date" name="deadline" class="form-control" value="{{task.deadline}}" required>
				</div>
				<div class="form-check mb-3">
					<input class="form-check-input" type="checkbox" name="completed" id="completedcheckbox"
						{% if task.completed %}checked{% endif %}
					<label class="form-check-label" for="completedcheckbox">Mark as Completed</label>
				</div>
				<button class="btn btn-primary">Update Task</button>
				<a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
			</form>
	</div>
</body>
</html>
