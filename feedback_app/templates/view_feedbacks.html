<!DOCTYPE html>
<html>
<head>
	<title>All Feedback</title>
	<link id="theme-style"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
	<div class="container mt-5">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2>All Feedbacks</h2>
			<div>
				<a href="/" class="btn btn-outline-primary me-2">Back To Form</a>
				<a href="/export/csv" class="btn btn-outline-success me-2">Export CSV</a>
				<a href="/export/json" class="btn btn-outline-info me-2">Export JSON</a>
				<button id="toggle-theme" class="btn btn-dark">Dark Mode</button>
			</div>
		</div>
		
		{% if feedbacks %}
			<table class="table table-bordered table-striped">
				<thead class="table-dark">
					<tr>
						<th>ID</th>
						<th>Name</th>
						<th>Email</th>
						<th>Message</th>
						<th>Timestamp</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					{% for fb in feedbacks %}
					<tr>
						<td>{{ fb.id }}</td>
						<td>{{ fb.name }}</td>
						<td>{{ fb.email }}</td>
						<td>{{ fb.message }}</td>
						<td>{{ fb.timestamp }}</td>
						<td>
							<form action="/delete/{{ fb.id }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this feedback?');">
							<button type="submit" class="btn btn-sm btn-danger">Delete</button>
							</form>
					</tr>
					{% endfor %}
				</tbody>
		</table>
		{% else %}
			<p>No feedback available </p>
		{% endif %}
	</div>
	
	<script>
		const btn = document.getElementById('toggle-theme');
		const tableHead = document.querySelector('thead');
		
		let dark = false;
		
		btn.addEventListener('click', () => {
			document.body.classList.toggle('bg-dark');
			document.body.classList.toggle('text-white');
			if (tableHead){
				tableHead.classList.toggle('table-dark')
				}
			dark = !dark;
			btn.textContent = dark ? 'Light mode' : 'Dark mode';
			btn.classList.toggle('btn-dark');
			btn.classList.toggle('btn-light');
			});
					
	</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
