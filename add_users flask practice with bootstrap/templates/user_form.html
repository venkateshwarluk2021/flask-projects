{% extends "layout.html" %}

{% block title %}{{ action }}User{% endblock %}

{% block content %}
	<h1 class="mb-4">{{ action }}User</h1>
	
	<form method="post">
		<div class="mb-3">
			<label for="name" class="form-label">Name:</label>
			<input type="text" id="name" name="name" class="form-control" value="{{ user.name if user else '' }}" required>
		</div>
		<div class="mb-3">
			<label for="email" class="form-label">Email:</label>
			<input type="email" id="email" name="email" class="form-control" value="{{ user.email if user else '' }}" required>
		</div>
		<button type="submit" class="btn btn-success">{{ action }}</button>
		<a href="/users" class="btn btn-seconday">Cancel</a>
	</form>
{% endblock %}
