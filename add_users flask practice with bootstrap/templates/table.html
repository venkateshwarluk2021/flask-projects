<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Bootstrap Table</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
	<div class="container">
		<h1 class="mb-4">User List</h1>
			<table class="table table-striped">
				<thead class="table-dark">
					<tr>
						<th>#</th>
						<th>Name</th>
						<th>Email</th>
					</tr>
				</thead>
				<tbody>
					{% for user in users %}
					<tr>
						<td>{{ loop.index }}</td>
						<td>{{ user.name }}</td>
						<td>{{ user.email }}</td>
					</tr>
					{% endfor %}
				</tbody>
			</table>
	</div>
</body>
</html>
