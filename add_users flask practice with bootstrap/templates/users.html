{% extends "layout.html" %}

{% block title %}Users{% endblock %}

{% block content %}
	<h1 class="mb-4">All Users</h1>
	<a href="/users/create" class="btn btn-success mb-3" >Add New User</a>
	<table class="table table-striped">
		<thead class="table-dark">
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th>Email</th>
				<th>Actions</th>
			</tr>
		</thead>
		<tbody>
			{% for user in users %}
			<tr>
				<td>{{ user.id }}</td>
				<td>{{ user.name }}</td>
				<td>{{ user.email }}</td>
				<td>
					<a href="/users/edit/{{ user.id }}" class="btn btn-primary btn-sm">Edit</a>
					<a href="/users/delete/{{ user.id }}" class="btn btn-danger btn-sm">Delete</a>
				</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
	{% endblock %}
