<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Bootstrap Cards</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
	<div class="container">
		<h1 class="mb-4">User Cards</h1>
		
		<div class="row">
			{% for user in users %}
				<div class="col-md-4">
					<div class="card mb-4">
						<div class="card-body">
							<h5 class="card-title">{{ user.name }}</h5>
							<p class="card-text">{{ user.email }}</p>
							<a href="/profile/{{ user.name|lower }}" class="btn btn-primary">View Profile</a>
						</div>
					</div>
				</div>
			{% endfor %}
		</div>
	</div>
</body>
</html>
