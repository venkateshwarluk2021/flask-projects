<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>BMI calculator</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
<div class="container mt-5">
	<div class="card shadow p-4">
		<h2 class="text-center">BMI calculator</h2>
		<form method="POST" class="mt-3">
			<div class="mb-3">
				<label for="weight" class="form-label">Weight(kg)</label>
				<input type="number" step="0.1" class="form-control" name="weight" required>
			</div>
			<div class="mb-3">
				<label for="height" class="form-label">Height(cm)</label>
				<input type="number" step="0.1" class="form-control" name="height" required>
			</div>
			<button type="submit" class="btn btn-primary w-100">Calculate BMI</button>
		</form>
		
		{% if bmi %}
		<div class="alert 
				{% if category == 'Underweight' %}alert-warning
				{% elif category == 'Normal' %}alert-success
				{% elif category == 'Overweight' %}alert-warning
				{% else %}alert-danger
				{% endif %} mt-4">
			<h5>Your BMI: {{ bmi | round(2) }}</h5>
				{% if category %}
				<p>Category: <strong>{{ category }}</strong></p>
				{% endif %}
		</div>
		{% endif %}
	</div>
</div>
</body>
</html>
