{% extends "base.html" %}
{% block content %}
<h3>Edit Expense</h3>
<form method="POST">
	<div class="mb-2"><input type="text" name="category" class="form-control" value="{{ expense.category }}" required></div>
	<div class="mb-2"><input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required></div>
	<div class="mb-2"><input type="text" name="note" class="form-control" value="{{ expense.note }}"></div>
	<button class="btn btn-primary">Save</button>
	<a href="/" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
